services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: templatePassword
      MONGO_INITDB_DATABASE: platform_template
    ports: []
    volumes:
      - mongo_data:/data/db
    networks:
      - template-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5

  springboot-template:
    image: alphadevug/springboot-template:latest
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_MONGODB_URI: mongodb://admin:templatePassword@mongodb:27017/platform_template?authSource=admin&directConnection=true&serverSelectionTimeoutMS=7000
      SPRING_MONGODB_DATABASE: platform_template
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - template-network

networks:
  template-network:
    driver: bridge

volumes:
  mongo_data: