services:
  app:
    build: .
    env_file:
      - .env
  mongodb:
    image: mongo:7.0
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}
    #(recommended)
    #
    #Only expose MongoDB internally:
    #
    #ports: []
    ports: []
    volumes:
      - mongo_data:/data/db
    networks:
      - template-network

  springboot-template:
    build: .
    image: springboot-template:latest
    #⚠️ 4. restart: always is OK, but consider unless-stopped
    #
    #Better:
    #
    #restart: unless-stopped
    #Why?
    #always restarts even after manual stop
    #unless-stopped is safer for VPS management
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      MONGODB_USERNAME: ${MONGODB_USERNAME:-admin}
      MONGODB_PASSWORD: ${MONGODB_PASSWORD:-templatePassword}
      MONGODB_HOST: mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-platform_template}
      MONGODB_AUTH_DATABASE: admin
    # ⚠️ 5. Missing dependency safety for MongoDB startup
    #depends_on:
    #  - mongodb
    #❌ Problem
    #
    #This does NOT guarantee MongoDB is ready — only started.
    #
    #Spring may start too early → connection failure.
    #
    #✅ Fix: add healthcheck
    #mongodb:
    #  image: mongo:7.0
    #  healthcheck:
    #    test: echo 'db.runCommand({ ping: 1 })' | mongosh localhost:27017/test --quiet
    #    interval: 10s
    #    timeout: 5s
    #    retries: 5
    #
    #Then:
    #
    #depends_on:
    #  mongodb:
    #    condition: service_healthy
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - template-network

networks:
  template-network:
    driver: bridge

volumes:
  mongo_data:
